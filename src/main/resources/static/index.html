<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistente de Cotizaciones</title>
<style>
    :root {
        --bg: #f1f5f9;
        --card: #ffffff;
        --border: #e2e8f0;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #6366f1;
        --accent-dark: #4f46e5;
        --accent-soft: #eef2ff;
        --green: #22c55e;
        --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: linear-gradient(160deg, #eef2ff 0%, #f8fafc 45%, #e0e7ff 100%);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px;
    }
    .shell {
        width: 100%;
        max-width: 900px;
        height: min(820px, calc(100vh - 32px));
        background: var(--card);
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.15);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        animation: fadeIn .4s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        background: var(--card);
        border-bottom: 1px solid var(--border);
    }
    .avatar {
        width: 42px; height: 42px;
        border-radius: 50%;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        display: flex; align-items: center; justify-content: center;
        color: white;
        flex-shrink: 0;
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }
    .head-title h1 { font-size: 16px; font-weight: 700; }
    .head-title p { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; }

    #chat {
        flex: 1;
        overflow-y: auto;
        padding: 22px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
        scroll-behavior: smooth;
    }
    .msg { max-width: 78%; display: flex; gap: 10px; animation: msgIn .25s ease; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .msg .avatar {
        width: 30px; height: 30px; font-size: 14px;
        box-shadow: none; margin-top: 2px;
    }
    .msg .bubble {
        padding: 11px 15px;
        border-radius: 16px;
        font-size: 14.5px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-wrap: break-word;
    }
    .msg .meta { font-size: 10.5px; color: var(--muted); margin-top: 5px; }
    .agent { align-self: flex-start; }
    .agent .bubble {
        background: var(--card);
        border: 1px solid var(--border);
        border-top-left-radius: 4px;
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }
    .user { align-self: flex-end; flex-direction: row-reverse; }
    .user .bubble {
        background: linear-gradient(135deg, var(--accent), var(--accent-dark));
        color: white;
        border-top-right-radius: 4px;
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }
    .error .bubble { background: #fef2f2; border-color: #fecaca; color: var(--red); }

    .typing { align-self: flex-start; display: flex; gap: 10px; align-items: flex-end; }
    .typing .bubble { display: flex; gap: 5px; padding: 14px 16px; }
    .typing .bubble span {
        width: 7px; height: 7px; border-radius: 50%;
        background: #a5b4fc;
        animation: bounce 1.2s infinite;
    }
    .typing .bubble span:nth-child(2) { animation-delay: .15s; }
    .typing .bubble span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

    .chips {
        display: flex;
        gap: 8px;
        padding: 10px 18px 4px;
        overflow-x: auto;
        background: var(--card);
        scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
        flex-shrink: 0;
        background: var(--accent-soft);
        color: var(--accent-dark);
        border: 1px solid #c7d2fe;
        border-radius: 999px;
        padding: 7px 13px;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        transition: all .15s ease;
        white-space: nowrap;
    }
    .chip:hover { background: var(--accent); color: white; border-color: var(--accent); }

    #inputBar {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 12px 16px 16px;
        background: var(--card);
        border-top: 1px solid var(--border);
    }
    #input {
        flex: 1;
        border: 1px solid var(--border);
        background: var(--bg);
        border-radius: 999px;
        padding: 13px 20px;
        font-size: 14.5px;
        outline: none;
        transition: border-color .15s, box-shadow .15s;
    }
    #input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }
    #send {
        width: 48px; height: 48px;
        border-radius: 50%;
        border: none;
        background: linear-gradient(135deg, var(--accent), var(--accent-dark));
        color: white;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        transition: transform .15s, opacity .15s;
    }
    #send:hover { transform: translateY(-2px); }
    #send:active { transform: scale(.95); }
    #send:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    @media (max-width: 600px) {
        body { padding: 0; }
        .shell { height: 100vh; border-radius: 0; box-shadow: none; }
        .msg { max-width: 88%; }
    }
</style>
</head>
<body>
<div class="shell">
    <header>
        <div class="avatar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3c-4.5 0-8 2.7-8 6 0 1.9 1.1 3.6 2.8 4.7-.2 1.1-.7 2.1-1.5 3 2.3.4 4.1-.2 5.2-.9 1 .5 2.3.7 3.5.7 4.5 0 8-2.7 8-6s-3.5-5-8-5z"/>
            </svg>
        </div>
        <div class="head-title">
            <h1>Asistente de Cotizaciones</h1>
            <p><span class="dot"></span> En línea - responde al instante</p>
        </div>
    </header>

    <div id="chat">
        <div class="msg agent">
            <div class="avatar">A</div>
            <div>
                <div class="bubble">Hola, soy tu asistente de cotizaciones del hogar. Pregúntame por plomería, electricidad o pintura.</div>
                <div class="meta">justo ahora</div>
            </div>
        </div>
    </div>

    <div class="chips">
        <button class="chip">Cambiar 4 grifos</button>
        <button class="chip">Pintar una casa de 100 m2</button>
        <button class="chip">Arreglar una fuga</button>
        <button class="chip">Instalar 3 enchufes</button>
    </div>

    <div id="inputBar">
        <input id="input" type="text" placeholder="Escribe tu mensaje..." autocomplete="off">
        <button id="send" title="Enviar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/>
            </svg>
        </button>
    </div>
</div>

<script>
    const cid = sessionStorage.getItem('cid') || ('chat-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8));
    sessionStorage.setItem('cid', cid);

    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    function now() {
        return new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
    }

    function addMsg(text, who) {
        const wrap = document.createElement('div');
        wrap.className = 'msg ' + who;
        wrap.innerHTML =
            (who === 'agent' ? '<div class="avatar">A</div>' : '') +
            '<div><div class="bubble"></div><div class="meta">' + now() + '</div></div>';
        wrap.querySelector('.bubble').textContent = text;
        chat.appendChild(wrap);
        chat.scrollTop = chat.scrollHeight;
    }

    function addTyping() {
        const wrap = document.createElement('div');
        wrap.className = 'msg agent typing';
        wrap.innerHTML =
            '<div class="avatar">A</div>' +
            '<div class="bubble"><span></span><span></span><span></span></div>';
        chat.appendChild(wrap);
        chat.scrollTop = chat.scrollHeight;
        return wrap;
    }

    async function send(text) {
        const msg = text || input.value.trim();
        if (!msg) return;
        input.value = '';
        sendBtn.disabled = true;
        addMsg(msg, 'user');
        const typing = addTyping();
        try {
            const url = '/chat?cid=' + encodeURIComponent(cid) + '&msg=' + encodeURIComponent(msg);
            const res = await fetch(url);
            const body = await res.text();
            typing.remove();
            addMsg(body, res.ok ? 'agent' : 'error');
        } catch (e) {
            typing.remove();
            addMsg('No se pudo conectar con el agente.', 'error');
        } finally {
            sendBtn.disabled = false;
            input.focus();
        }
    }

    sendBtn.addEventListener('click', () => send());
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
    document.querySelectorAll('.chip').forEach((chip) =>
        chip.addEventListener('click', () => send(chip.textContent)));
</script>
</body>
</html>
